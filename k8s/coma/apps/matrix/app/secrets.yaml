apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: matrix-stack-postgres-auth
  namespace: matrix
spec:
  refreshInterval: 15s
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: matrix-stack-postgres-auth
  data:
    - secretKey: username
      remoteRef:
        key: matrix-stack/postgres-auth
        property: username
    - secretKey: password
      remoteRef:
        key: matrix-stack/postgres-auth
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: matrix-rtc-auth
  namespace: matrix
spec:
  refreshInterval: 15s
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: matrix-rtc-auth
  data:
    - secretKey: livekit-secret
      remoteRef:
        key: synapse/rtc
        property: livekit-secret
