apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: matrix-turn
  namespace: matrix
spec:
  secretName: matrix-turn-tls
  dnsNames:
    - turn.matrix.artichoke.cc
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
---
# TURN is TLS, not HTTP. Envoy routes by SNI and LiveKit terminates TLS.
# LiveKit advertises TURN/TLS on 443. the chart Service maps 443 to pod 5349.
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TLSRoute
metadata:
  name: matrix-turn
  namespace: matrix
spec:
  parentRefs:
    - name: web-gateway
      namespace: networking
      sectionName: matrix-turn-tls
  hostnames:
    - turn.matrix.artichoke.cc
  rules:
    - backendRefs:
        - name: matrix-stack-matrix-rtc-sfu-turn-tls
          port: 443
