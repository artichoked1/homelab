apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: thelounge-config
  namespace: thelounge
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault-cupboard
    kind: ClusterSecretStore
  target:
    name: thelounge-config
  data:
    - secretKey: config.js
      remoteRef:
        key: thelounge/config
        property: config.js
