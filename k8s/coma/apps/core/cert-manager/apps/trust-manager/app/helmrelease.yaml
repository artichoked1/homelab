apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: trust-manager
  namespace: cert-manager
spec:
  interval: 5m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 0.26.0
  url: oci://quay.io/jetstack/charts/trust-manager
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trust-manager
  namespace: cert-manager
spec:
  chartRef:
    kind: OCIRepository
    name: trust-manager
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  interval: 1m0s

  releaseName: trust-manager
  targetNamespace: cert-manager
  # values:
