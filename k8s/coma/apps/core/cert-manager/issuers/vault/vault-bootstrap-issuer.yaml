apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: artichoke-vault-server
  namespace: vault
spec:
  vault:
    server: http://vault.vault.svc.cluster.local:8200
    path: pki-infra/sign/vault-server
    auth:
      kubernetes:
        mountPath: /v1/auth/kubernetes
        role: coma-vault-server
        serviceAccountRef:
          name: vault-issuer
