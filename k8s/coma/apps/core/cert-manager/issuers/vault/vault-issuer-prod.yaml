apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: artichoke-infra
spec:
  vault:
    server: http://vault.vault.svc.cluster.local:8200
    # Vault PKI signing role
    path: pki-infra/sign/k8s-ingress
    auth:
      kubernetes:
        mountPath: /v1/auth/kubernetes
        # Vault Kubernetes authentication role
        role: coma-artichoke-infra
        # Kubernetes ServiceAccount identity
        serviceAccountRef:
          name: vault-issuer
