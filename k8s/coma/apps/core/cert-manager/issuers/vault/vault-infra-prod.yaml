apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: vault-infra
spec:
  vault:
    server: http://vault.vault.svc.cluster.local:8200
    path: pki-infra/sign/k8s-ingress
    auth:
      kubernetes:
        mountPath: /v1/auth/kubernetes
        role: coma-cert-manager
        serviceAccountRef:
          name: vault-issuer
