apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-issuer
  namespace: vault
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vault-issuer-token
  namespace: vault
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: ["vault-issuer"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vault-issuer-token
  namespace: vault
subjects:
  - kind: ServiceAccount
    name: cert-manager
    namespace: cert-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vault-issuer-token
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: artichoke-vault-server
  namespace: vault
spec:
  vault:
    server: http://vault.vault.svc.cluster.local:8200
    path: pki-infra/sign/vault-server
    auth:
      kubernetes:
        mountPath: /v1/auth/kubernetes
        role: coma-vault-server
        serviceAccountRef:
          name: vault-issuer
