apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-server
  namespace: vault
spec:
  secretName: vault-server-tls
  commonName: vault.coma.artichoke.network
  dnsNames:
    - vault.vault.svc
    - vault.vault.svc.cluster.local
    - vault.artichoke.network
    - vault.coma.artichoke.network

  duration: 2160h
  renewBefore: 720h

  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always

  usages:
    - digital signature
    - server auth

  issuerRef:
    name: artichoke-vault-server
    kind: Issuer
