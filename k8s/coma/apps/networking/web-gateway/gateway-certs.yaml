# Keep certificate SANs disjoint between HTTPS listeners sharing :443.
# Envoy Gateway otherwise disables HTTP/2 on overlapping listeners to prevent
# unsafe HTTP/2 connection coalescing across listener boundaries.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: artichokecc-cert
  namespace: networking
spec:
  secretName: artichokecc-wildcard-cert
  dnsNames:
    - "*.artichoke.cc"
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: artichokecc-root-cert
  namespace: networking
spec:
  secretName: artichokecc-root-cert
  dnsNames:
    - "artichoke.cc"
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: auth-artichokecc-wildcard-cert
  namespace: networking
spec:
  secretName: auth-artichokecc-wildcard-cert
  dnsNames:
    - "*.auth.artichoke.cc"
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: coder-artichokecc-wildcard-cert
  namespace: networking
spec:
  secretName: coder-artichokecc-wildcard-cert
  dnsNames:
    - "*.coder.artichoke.cc"
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: npatrick-cert
  namespace: networking
spec:
  secretName: npatrick-cert
  dnsNames:
    - "nikolaipatrick.com"
    - "www.nikolaipatrick.com"
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: coma-artichoke-local-cert
  namespace: networking
spec:
  commonName: "coma.artichoke.network"
  secretName: coma-artichoke-local-wildcard-cert
  dnsNames:
    - "coma.artichoke.network"
    - "*.coma.artichoke.network"
  issuerRef:
    name: vault-issuer
    kind: ClusterIssuer
---
